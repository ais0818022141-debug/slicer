<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 18px; padding: 30px; background: #f1f5f9; }
.card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
.exp-opt-item { display: block; margin: 8px 0; padding-right: 12px; }
.opt-letter-tag { color: #0284c7; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
<h3>اختبار 1: بدون RLM</h3>
<div class="exp-opt-item"><bdi class="opt-letter-tag">A)</bdi> <span>وترافقه مع MEN2B.</span></div>
<div class="exp-opt-item"><bdi class="opt-letter-tag">B)</bdi> <span>وطفرات RET.</span></div>
</div>

<div class="card">
<h3>اختبار 2: مع RLM (&rlm;)</h3>
<div class="exp-opt-item"><bdi class="opt-letter-tag">A)</bdi> <span>وترافقه مع MEN2B.&rlm;</span></div>
<div class="exp-opt-item"><bdi class="opt-letter-tag">B)</bdi> <span>وطفرات RET.&rlm;</span></div>
</div>

<div class="card">
<h3>اختبار 3: مع كلمة عربية (متلازمة MEN2B / مورثة RET)</h3>
<div class="exp-opt-item"><bdi class="opt-letter-tag">A)</bdi> <span>وترافقه مع متلازمة MEN 2B.</span></div>
<div class="exp-opt-item"><bdi class="opt-letter-tag">B)</bdi> <span>وطفرات مورثة RET.</span></div>
</div>

</body>
</html>
